name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # The two errors below are pre-existing in a vendored settings package and
      # are the only ones allowed. Anything else fails the job.
      - name: Typecheck
        run: |
          bunx tsc --noEmit > tsc.log 2>&1 || true
          if grep -E "error TS[0-9]+" tsc.log | grep -vF "src/edited_packages/spcr-settings/settingsSection.tsx"; then
            echo "::error::TypeScript errors outside the known baseline"
            exit 1
          fi

      # CI=true makes spicetify-creator skip Spicetify operations, so the build
      # only emits dist/ and does not need a Spotify install.
      - name: Build
        run: bun run build

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: spicy-lyrics-extension
          path: dist/spicy-lyrics.js
          if-no-files-found: error
          retention-days: 14
